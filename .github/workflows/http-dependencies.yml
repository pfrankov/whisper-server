name: HTTP dependency regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  http-dependencies:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Resolve the exact app package graph
        run: |
          xcodebuild -resolvePackageDependencies -project WhisperServer.xcodeproj -scheme WhisperServer -onlyUsePackageVersionsFromResolvedFile
          git diff --exit-code -- WhisperServer.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Test HTTP decoder, decompression and Vapor transport
        run: python3 scripts/test_http_dependencies.py

  native-app:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build public native SDK, test app and verify package
        run: bash scripts/build_native_ci.sh
      - name: Save verified candidate (publication is separate)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WhisperServer-candidate
          path: ${{ runner.temp }}/whisper-artifact/
          if-no-files-found: error
          retention-days: 7
